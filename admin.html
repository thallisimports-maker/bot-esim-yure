<script>
  const URL_BACKEND = "https://bot-esim-yure.onrender.com";

  async function autenticarServidor() {
    const campoSenha = document.getElementById('senhaAdmin');
    const erroLogin = document.getElementById('erroLogin');

    if (!campoSenha) return;
    const senha = campoSenha.value;

    try {
      const res = await fetch(URL_BACKEND + '/api/admin/login?senha=' + encodeURIComponent(senha));

      if (res.ok) {
        const data = await res.json();
        sessionStorage.setItem('token_admin', data.token);
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('painelConteudo').style.display = 'block';
        carregarPainel();
      } else {
        erroLogin.style.display = 'block';
      }
    } catch (e) {
      console.error("Erro na requisição:", e);
      erroLogin.style.display = 'block';
    }
  }

  async function carregarPainel() {
    const token = sessionStorage.getItem('token_admin');
    if (!token) return;

    try {
      const res = await fetch(URL_BACKEND + '/api/admin/dados', {
        headers: { 'Authorization': 'Bearer ' + token }
      });

      if (!res.ok) {
        sessionStorage.removeItem('token_admin');
        location.reload();
        return;
      }

      const dados = await res.json();

      // Métricas
      const produtos = dados.produtos || [];
      const disponiveis = produtos.filter(p => p.status === 'disponivel').length;
      const vendidos = produtos.filter(p => p.status === 'vendido').length;
      
      document.getElementById('totalDisponivel').innerText = disponiveis;
      document.getElementById('totalVendido').innerText = vendidos;
      document.getElementById('totalClientes').innerText = Object.keys(dados.utilizadores || {}).length;

      // Tabela de Estoque
      const tabelaEstoque = document.getElementById('tabelaEstoque');
      if (produtos.length === 0) {
        tabelaEstoque.innerHTML = '<tr><td colspan="5">Nenhum e-SIM cadastrado.</td></tr>';
      } else {
        tabelaEstoque.innerHTML = produtos.map(p => `
          <tr>
            <td><code>${p.id}</code></td>
            <td>${p.operadora}</td>
            <td>${p.plano}</td>
            <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
            <td class="status-${p.status}">${p.status.toUpperCase()}</td>
          </tr>
        `).join('');
      }

      // Tabela de Funil
      const tabelaUtilizadores = document.getElementById('tabelaUtilizadores');
      const utilizadores = Object.entries(dados.utilizadores || {});
      if (utilizadores.length === 0) {
        tabelaUtilizadores.innerHTML = '<tr><td colspan="4">Nenhum cliente registrado ainda.</td></tr>';
      } else {
        tabelaUtilizadores.innerHTML = utilizadores.map(([id, u]) => `
          <tr>
            <td><code>${id}</code></td>
            <td>${u.nome || 'N/A'}</td>
            <td>@${u.username || 'sem_username'}</td>
            <td><strong style="color: var(--accent-color);">${u.ultimo_passo || 'start'}</strong></td>
          </tr>
        `).join('');
      }
    } catch (e) {
      console.error('Erro ao carregar dados:', e);
    }
  }

  document.getElementById('formCadastro').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const token = sessionStorage.getItem('token_admin');
    if (!token) {
      alert("Sessão expirada. Faça login novamente.");
      return;
    }

    const operadora = document.getElementById('operadora').value;
    const plano = document.getElementById('plano').value;
    const descEl = document.getElementById('descricao');
    const descricao = descEl ? descEl.value : '';
    const preco = parseFloat(document.getElementById('preco').value);
    const arquivoInput = document.getElementById('arquivo_qr');
    const urlInput = document.getElementById('imagem_qr');
    let imagem_qr = urlInput ? urlInput.value.trim() : '';

    if (arquivoInput && arquivoInput.files && arquivoInput.files[0]) {
      const reader = new FileReader();
      reader.onload = async function(evt) {
        imagem_qr = evt.target.result;
        await enviarProduto({ operadora, plano, descricao, preco, imagem_qr }, token);
      };
      reader.readAsDataURL(arquivoInput.files[0]);
    } else {
      if (!imagem_qr) {
        alert("Por favor, insira a URL/caminho da imagem ou selecione um arquivo.");
        return;
      }
      await enviarProduto({ operadora, plano, descricao, preco, imagem_qr }, token);
    }
  });

  async function enviarProduto(dadosProduto, token) {
    try {
      const res = await fetch(URL_BACKEND + '/api/admin/produtos', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify(dadosProduto)
      });

      if (res.ok) {
        alert("✅ e-SIM cadastrado no estoque com sucesso!");
        document.getElementById('formCadastro').reset();
        await carregarPainel();
      } else {
        const errData = await res.json().catch(() => ({}));
        alert("❌ Erro ao salvar no servidor: " + (errData.detail || res.statusText));
      }
    } catch (err) {
      console.error("Erro ao enviar produto:", err);
      alert("❌ Falha na conexão ao cadastrar o produto.");
    }
  }

  if (sessionStorage.getItem('token_admin')) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('painelConteudo').style.display = 'block';
    carregarPainel();
  }

  setInterval(() => {
    if (sessionStorage.getItem('token_admin')) {
      carregarPainel();
    }
  }, 10000);
</script>
