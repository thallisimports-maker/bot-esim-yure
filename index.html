<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yure e-SIM Store — Área do Cliente</title>
    <!-- 📱 COMPONENTE DE INTEGRAÇÃO OFICIAL DOS MINIAPPS DO TELEGRAM -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-principal: #0b0f19;
            --bg-card: #111827;
            --cor-neon: #3b82f6;
            --cor-sucesso: #10b981;
            --texto-claro: #f3f4f6;
            --texto-escuro: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 5px 0;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            color: var(--texto-escuro);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .banner {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }

        .secao-titulo {
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 10px 0;
            color: var(--texto-claro);
            border-left: 4px solid var(--cor-neon);
            padding-left: 10px;
        }

        .card-plano {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-plano { text-align: left; }
        .nome-operadora { font-size: 18px; font-weight: bold; }
        .preco-plano { color: var(--cor-sucesso); font-size: 16px; font-weight: 600; margin-top: 4px; }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-comprar { background: var(--cor-sucesso); color: white; }
        .btn-recarga { background: var(--cor-neon); color: white; width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .bloco-recarga { background: #111827; border: 1px dashed #374151; border-radius: 12px; padding: 20px; margin-top: 25px; }
        .input-recarga { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: var(--bg-principal); color: white; text-align: center; font-size: 18px; font-weight: bold; box-sizing: border-box; outline: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📶 Yure e-SIM Store</h1>
        <div class="subtitulo">Sua Área Virtual de Telecomunicação Móvel</div>
        
        <img src="https://unsplash.com" class="banner" alt="Banner Tecnologia">

        <div class="secao-titulo">Escolha seu plano e-SIM</div>

        <div class="card-plano">
            <div class="info-plano">
                <div class="nome-operadora">Vivo 30GB</div>
                <div class="preco-plano">R\$ 25,00</div>
            </div>
            <button class="btn btn-comprar" onclick="escolherPlano('Vivo 30GB', 25)">Comprar</button>
        </div>

        <div class="card-plano">
            <div class="info-plano">
                <div class="nome-operadora">Tim 40GB</div>
                <div class="preco-plano">R\$ 30,00</div>
            </div>
            <button class="btn btn-comprar" onclick="escolherPlano('Tim 40GB', 30)">Comprar</button>
        </div>

        <div class="card-plano">
            <div class="info-plano">
                <div class="nome-operadora">Claro 40GB</div>
                <div class="preco-plano">R\$ 35,00</div>
            </div>
            <button class="btn btn-comprar" onclick="escolherPlano('Claro 40GB', 35)">Comprar</button>
        </div>

        <div class="bloco-recarga">
            <div class="secao-titulo" style="margin-top: 0; border-left-color: #a855f7;">Adicionar Saldo Instantâneo</div>
            <p style="font-size: 13px; color: var(--texto-escuro); margin: 0 0 15px 0; text-align: left;">Insira o valor abaixo para fabricar o seu QR Code Pix de produção.</p>
            
            <input type="number" id="valorPix" class="input-recarga" min="10" value="10" placeholder="R\$ 10">
            <button id="btnGerar" class="btn btn-recarga" onclick="solicitarPix()">Fabricar QR Code Pix</button>
        </div>
    </div>

    <script>
        // 🔑 VARIÁVEL PADRONIZADA EM MINÚSCULO CONFORME DECLARAÇÃO ORIGINAL
        const pushinpay_token = "71067|pld7jJIxFtcvN74KDLhxhK6m7xoK6dcj1vMhILXOc5d12204";

        // Inicializa o WebApp do Telegram para garantir que os métodos de ponte estejam prontos
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Abre o MiniApp em tela cheia no celular
        }

        function escolherPlano(nome, preco) {
            alert(`🎉 PLANO SELECIONADO!\n\nVocê escolheu o plano ${nome} por R$ ${preco},00.\n\n👉 Agora, clique no botão de recarga abaixo para efetuar o pagamento e receber o e-SIM.`);
            document.getElementById('valorPix').value = preco;
        }

        function solicitarPix() {
            const valorInput = document.getElementById('valorPix').value;
            
            if (!valorInput || parseFloat(valorInput) < 10) {
                alert("⚠️ ATENÇÃO: O valor mínimo estipulado para gerar o Pix é de R\$ 10,00.");
                return;
            }

            // 🚀 LINK DE CHECKOUT CORRIGIDO DE FORMA LITERAL E VINCULADO À VARIÁVEL MINÚSCULA CORRETA
            const linkCheckout = `https://pushinpay.com.br{pushinpay_token}&value=${valorInput}&external_id=site_web_${Date.now()}`;
            
            // Verifica o ambiente e executa a abertura segura para evitar erros de DNS ou escape do MiniApp
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(linkCheckout);
            } else {
                window.location.href = linkCheckout;
            }
        }
    </script>
</body>
</html>
