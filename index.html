<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eSIMS YURE - Loja</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1e222d;
      --accent-gold: #d4af37;
      --text-color: #ffffff;
      --text-muted: #9ca3af;
      --border-color: #2e3446;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 15px;
    }

    h2 {
      color: var(--accent-gold);
      text-align: center;
      margin-bottom: 20px;
    }

    .grid-produtos {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-produto {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-produto h3 {
      margin: 0 0 5px 0;
      font-size: 16px;
      color: #fff;
    }

    .info-produto p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .btn-comprar {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .sem-estoque {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      background: var(--card-bg);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h2>📱 Escolha seu e-SIM</h2>
  
  <div id="listaProdutos" class="grid-produtos">
    <div class="sem-estoque">Carregando estoque disponível...</div>
  </div>

  <script>
    const URL_BACKEND = "https://bot-esim-yure.onrender.com";
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    async function carregarProdutosMinisite() {
      try {
        const res = await fetch(URL_BACKEND + '/api/admin/dados');
        const dados = await res.json();
        
        const container = document.getElementById('listaProdutos');
        const produtos = dados.produtos || [];

        // Filtra apenas produtos com status 'disponivel'
        const disponiveis = produtos.filter(p => (p.status || '').toLowerCase() === 'disponivel');

        if (disponiveis.length === 0) {
          container.innerHTML = '<div class="sem-estoque">❌ Nenhum e-SIM disponível no momento.</div>';
          return;
        }

        let html = '';
        disponiveis.forEach(p => {
          html += `
            <div class="card-produto">
              <div class="info-produto">
                <h3>📲 ${p.operadora} - ${p.plano}</h3>
                <p>Preço: <strong>R$ ${parseFloat(p.preco || 0).toFixed(2)}</strong></p>
              </div>
              <button class="btn-comprar" onclick="comprarItem('${p.id}')">Comprar</button>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        document.getElementById('listaProdutos').innerHTML = '<div class="sem-estoque">❌ Erro ao carregar estoque.</div>';
      }
    }

    function comprarItem(idProduto) {
      if (tg) {
        // Envia o ID da compra de volta para o Bot via WebApp
        tg.sendData(JSON.stringify({ acao: 'comprar', id: idProduto }));
        tg.close();
      } else {
        alert("Para comprar, abra este MiniApp dentro do Telegram!");
      }
    }

    carregarProdutosMinisite();
  </script>
</body>
</html>
