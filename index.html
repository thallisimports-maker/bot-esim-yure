<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yure e-SIM - Chips Virtuais</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0f19; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #1f2937; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #3b82f6; margin-bottom: 5px; }
        .banner { width: 100%; border-radius: 8px; margin-bottom: 20px; }
        .card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-buy { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-buy:hover { background: #059669; }
        .input-recarga { width: 80%; padding: 10px; border-radius: 6px; border: 1px solid #374151; background: #0b0f19; color: white; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📶 Yure e-SIM Store</h1>
        <p style="color: #9ca3af;">Adquira seu plano de chip virtual instantaneamente</p>
        <img src="https://freepik.com" class="banner" alt="Banner e-SIM">
        
        <div class="card">
            <div><strong>Vivo 30GB</strong><br><span style="color: #10b981;">R\$ 25,00</span></div>
            <button class="btn-buy" onclick="comprar('vivo_30gb', 25)">Comprar</button>
        </div>
        <div class="card">
            <div><strong>Tim 40GB</strong><br><span style="color: #10b981;">R\$ 30,00</span></div>
            <button class="btn-buy" onclick="comprar('tim_40gb', 30)">Comprar</button>
        </div>
        <div class="card">
            <div><strong>Claro 40GB</strong><br><span style="color: #10b981;">R\$ 35,00</span></div>
            <button class="btn-buy" onclick="comprar('claro_40gb', 35)">Comprar</button>
        </div>

        <div style="margin-top: 30px; border-top: 1px solid #1f2937; padding-top: 20px;">
            <h3>➕ Adicionar Saldo via Pix</h3>
            <input type="number" id="valorPix" class="input-recarga" placeholder="Digite o valor (Mínimo R\$ 10)" min="10">
            <button class="btn-buy" style="background: #3b82f6; width: 85%;" onclick="gerarPix()">Gerar QR Code Pix</button>
        </div>
    </div>

    <script>
        const PUSHINPAY_TOKEN = "71067|pld7jJIxFtcvN74KDLhxhK6m7xoK6dcj1vMhILXOc5d12204";

        async function gerarPix() {
            const valor = document.getElementById('valorPix').value;
            if(!valor || valor < 10) { Swal.fire('⚠️ Atenção', 'O valor mínimo é de R\$ 10,00', 'warning'); return; }
            
            Swal.fire({ title: 'Gerando Pix...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const response = await fetch('https://pushinpay.com.br', {
                    method: 'POST',
                    headers: { 'Authorization': `bearer ${PUSHINPAY_TOKEN}`, 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ value: parseInt(valor * 100), webhook_url: "https://google.com", external_id: "site_cliente", customer: { name: "Cliente Web", email: "cliente@gmail.com", document: "03620633037" } })
                });
                const data = await response.json();
                if(data.qr_code) {
                    Swal.fire({
                        title: '📥 Pix Gerado com Sucesso!',
                        html: `<p>Abra o app do seu banco e pague pelo Copia e Cola abaixo:</p><textarea style="width:100%;height:80px;background:#0b0f19;color:#fff;border-radius:6px;padding:5px;" readonly>${data.qr_code}</textarea>`,
                        icon: 'success'
                    });
                } else { Swal.fire('❌ Erro', 'Não foi possível gerar o Pix no momento.', 'error'); }
            } catch(e) { Swal.fire('❌ Erro', 'Falha ao conectar com o gateway.', 'error'); }
        }

        function comprar(plano, preco) {
            Swal.fire('🎉 Plano Selecionado!', `Você escolheu o plano ${plano.toUpperCase()} por R$ ${preco},00. Adicione saldo via Pix para concluir a liberação do seu e-SIM!`, 'success');
        }
    </script>
</body>
</html>
